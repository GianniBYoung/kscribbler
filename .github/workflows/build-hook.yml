---
name: Build NickelHook plugin

on:
  workflow_call:

jobs:
  hook:
    runs-on: ubuntu-latest
    container: ghcr.io/pgaskin/nickeltc:1.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build NickelHook plugin
        run: make -C hook

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: libkscribbler
          path: hook/libkscribbler.so
